name: workspace-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workspace and public submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Run workspace checks
        run: node tooling/checks/check-workspace.mjs --require-submodule

      - name: Report scope
        if: always()
        run: |
          echo "This workflow validates workspace structure and hygiene only."
          echo "It does not build the browser, run product tests, or verify security properties."
